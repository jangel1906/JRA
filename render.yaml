services:
  - type: web
    name: edge-atlas
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn edge_atlas_app:server --bind 0.0.0.0:$PORT --timeout 120 --workers 1
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: PORT
        value: "10000"
